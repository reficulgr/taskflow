name: Deploy to live site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to GreenGeeks via FTPS
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: "21"
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: |
          set -euo pipefail
          BASE="ftp://$FTP_HOST:$FTP_PORT"
          cd "$GITHUB_WORKSPACE"
          files=$(find . -type f \
            ! -path './.git/*' \
            ! -path './.github/*' \
            ! -path './mcp-server/*' \
            ! -path './sessions/*' \
            ! -name '*.sql' \
            ! -name 'config.example.php' \
            ! -name 'config.php' \
            ! -name '.gitignore' \
            ! -name '.virgo-ftp.json' \
            ! -name 'README.md')
          echo "$files" | sed 's|^\./||' | while IFS= read -r f; do
            curl -sS --ssl-reqd --connect-timeout 20 --retry 3 --ftp-create-dirs \
              -u "$FTP_USER:$FTP_PASS" -T "$f" "$BASE$FTP_REMOTE_DIR/$f" \
              || { echo "FAILED: $f"; exit 1; }
            echo "uploaded: $f"
          done
          echo "Deploy complete."